version: 2

updates:
  # PHP dependencies. Grouped so a routine sweep arrives as one PR rather than
  # one per package -- they are verified together by `composer check` anyway.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
      prefix-development: chore
    groups:
      composer-dependencies:
        patterns:
          - '*'

  # Base images in the Dockerfile (composer, FrankenPHP)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      docker-images:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

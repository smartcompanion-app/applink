name: pr-title

# release-please derives the version and the changelog from the squash-merged
# PR title, so a title that is not a Conventional Commit silently skips a release.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: PR title
    runs-on: ubuntu-24.04
    steps:
      - name: Check Conventional Commit PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            docs
            chore
            ci
            test
            refactor
            build
            revert
          requireScope: false

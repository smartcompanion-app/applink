name: release

on:
  push:
    branches:
      - main
  # (Re)publishes the image of an existing release, e.g. after a failed
  # publish or to pick up base image security fixes without a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v0.2.0'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/smartcompanion-app/applink

jobs:

  # Opens (or updates) a "chore: release" pull request collecting the
  # conventional commits since the last release. Merging that PR runs this
  # workflow again, which then tags the release, creates the GitHub release
  # and hands over to the docker job below.
  #
  # RELEASE_TOKEN is a personal access token with contents and pull request
  # write access. It is optional but recommended: pull requests opened with
  # the default GITHUB_TOKEN do not trigger workflows, so the release pull
  # request would sit with no CI checks. Falls back to GITHUB_TOKEN when the
  # secret is absent.
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release pull request or release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: Publish image
    needs: release-please
    # always() lets a manual run through although release-please is skipped then
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Signing the build provenance: the workflow's OIDC identity is exchanged
      # for a short-lived Sigstore certificate, so there is no signing key to keep.
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
      - name: Checkout ${{ env.TAG }}
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      # QEMU emulates arm64 on the amd64 runner for the multi-platform build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=true
          # 1.2.3, 1.2 and -- from 1.0.0 on -- 1
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ !startsWith(env.TAG, 'v0.') }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signed SLSA build provenance, verifiable with
      # `gh attestation verify oci://ghcr.io/smartcompanion-app/applink:<version> -R smartcompanion-app/applink`
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

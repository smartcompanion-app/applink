name: ci

# Pushes are only built for main. A push to any other branch that has a PR open
# would otherwise be built twice -- once for the push, once for the pull_request.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a PR makes the run in progress obsolete. Runs on main are never
# cancelled, they gate the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v4
      - name: Code style (PSR-12)
        run: composer lint
      - name: Static analysis (PHPStan)
        run: composer analyse

  # The lowest supported PHP version and the one the Docker image ships with.
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v4
      - name: Unit tests
        run: composer test

  # Builds the image the release publishes and runs it against the example
  # configuration, so a broken Dockerfile or Caddyfile fails here and not on release.
  docker:
    name: Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: applink:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name applink -p 9080:80 \
            -v "$PWD/docs/example_storage:/applink/storage:ro" applink:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' applink)" = healthy ] && exit 0
            sleep 1
          done
          docker logs applink
          exit 1
      - name: Smoke test
        run: bin/smoke-test.sh http://localhost:9080
      - name: Container logs
        if: failure()
        run: docker logs applink
